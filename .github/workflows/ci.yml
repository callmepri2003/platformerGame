name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Floor applies to Platformer.Core only; see coverlet.runsettings for why.
  MIN_CORE_LINE_COVERAGE: "90"

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Enforce coverage threshold
        run: |
          python3 - "$MIN_CORE_LINE_COVERAGE" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          floor = float(sys.argv[1])
          reports = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if not reports:
              print("### Coverage: no report produced")
              sys.exit("::error::no coverage report produced")

          # The floor is scoped to Platformer.Core. Reading the per-package rate
          # rather than the report total means an unmeasured or newly added
          # assembly can never dilute - or flatter - the number being gated.
          rates = [
              (float(pkg.get("line-rate", 0)) * 100, float(pkg.get("branch-rate", 0)) * 100)
              for report in reports
              for pkg in ET.parse(report).getroot().iter("package")
              if pkg.get("name") == "Platformer.Core"
          ]
          if not rates:
              print("### Coverage: Platformer.Core produced no coverage data")
              sys.exit(
                  "::error::Platformer.Core is absent from the coverage report; "
                  "an empty measurement must not be able to satisfy the gate"
              )

          line, branch = max(rates)
          verdict = "PASS" if line >= floor else "FAIL"
          print(f"### Platformer.Core coverage: {line:.1f}% line, {branch:.1f}% branch")
          print(f"Floor is {floor:.0f}% line - **{verdict}**")
          print("")
          print("Platformer.Desktop is excluded by design; see `coverlet.runsettings`.")
          if line < floor:
              sys.exit(
                  f"::error::Platformer.Core line coverage {line:.1f}% is below the {floor:.0f}% floor"
              )
          PY

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
