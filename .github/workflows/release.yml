name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish self-contained build
        run: |
          dotnet publish src/Platformer.Desktop/Platformer.Desktop.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=embedded \
            --output artifacts/${{ matrix.rid }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: platformer-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd artifacts/${{ matrix.rid }}
          zip -qr "../platformer-${{ matrix.rid }}.zip" .
          gh release upload "${GITHUB_REF_NAME}" "../platformer-${{ matrix.rid }}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
